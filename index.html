<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Traveler — Luminaries Database</title>
<style>
  :root{
    --bg:#0c0e14; --bg2:#11141d; --panel:#161a26; --panel2:#1c2130;
    --line:#272d3d; --line2:#333b50;
    --txt:#e6e9f2; --muted:#8b93a7; --muted2:#5f6678;
    --accent:#6ea8fe; --accent2:#b794f6;
    --gold:#ffd24a;
    --guardian:#38bdf8; --priest:#34d399; --assassin:#a78bfa;
    --warrior:#f87171; --archer:#fbbf24; --mage:#f472b6;
    --ss:#ff4d8d; --s:#ff9e2c; --a:#46d39a; --b:#5b9bf6; --c:#7a8497;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, #1a2030 0%, var(--bg) 55%) fixed;
    color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Thai",sans-serif;
    font-size:14px; line-height:1.6; display:flex; min-height:100vh;
  }
  a{color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:248px; flex-shrink:0; background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-right:1px solid var(--line); padding:18px 14px; position:sticky; top:0;
    height:100vh; overflow-y:auto; display:flex; flex-direction:column; gap:15px;
  }
  .brand{display:flex;flex-direction:column;gap:2px;padding:4px 6px 0}
  .brand h1{font-size:18px;font-weight:800;letter-spacing:.3px;
    background:linear-gradient(90deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}

  .langrow{display:flex;gap:8px;align-items:center}
  .langtoggle{display:inline-flex;background:var(--panel);border:1px solid var(--line2);border-radius:9px;overflow:hidden;flex:1}
  .langtoggle button{flex:1;border:none;background:transparent;color:var(--muted);padding:8px 0;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--panel2);color:#fff}
  .langtoggle button.active[data-l="th"]{color:var(--archer)}
  .langtoggle button.active[data-l="en"]{color:var(--accent)}

  .search{position:relative}
  .search input{
    width:100%; background:var(--panel); border:1px solid var(--line2); color:var(--txt);
    border-radius:10px; padding:9px 12px 9px 32px; font-size:13px; outline:none;
  }
  .search input:focus{border-color:var(--accent)}
  .search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted2)}

  .navlabel{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted2);padding:0 8px;margin-top:2px}
  .classlist{display:flex;flex-direction:column;gap:3px}
  .classbtn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
    background:transparent;border:1px solid transparent;color:var(--muted);
    padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:600;transition:.13s;
  }
  .classbtn:hover{background:var(--panel);color:var(--txt)}
  .classbtn.active{background:var(--panel2);color:#fff;border-color:var(--line2)}
  .classbtn .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
  .classbtn .cnt{margin-left:auto;font-size:11px;color:var(--muted2);font-weight:700;
    background:var(--bg);padding:1px 7px;border-radius:20px;border:1px solid var(--line)}
  .classbtn.active .cnt{color:var(--txt)}

  .side-foot{margin-top:auto;font-size:10.5px;color:var(--muted2);padding:8px 6px;border-top:1px solid var(--line);line-height:1.5}
  .side-foot a{color:var(--muted);text-decoration:underline}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:5;background:rgba(12,14,20,.82);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .topbar h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px}
  .topbar h2 .pill{font-size:11px;font-weight:700;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);padding:2px 9px;border-radius:20px}
  .controls{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .controls select,.toggle button{
    background:var(--panel);border:1px solid var(--line2);color:var(--txt);
    border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer;outline:none;font-weight:600;
  }
  .controls select:focus{border-color:var(--accent)}
  .toggle{display:inline-flex;background:var(--panel);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .toggle button{border:none;border-radius:0;background:transparent;color:var(--muted)}
  .toggle button.active{background:var(--panel2);color:#fff}

  .content{padding:20px 22px 60px}

  /* ---------- Card grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}
  .card{
    background:linear-gradient(165deg,var(--panel),var(--bg2));
    border:1px solid var(--line);border-radius:14px;padding:15px 15px 13px;cursor:pointer;
    position:relative;overflow:hidden;transition:.16s;
  }
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--cc,#555);opacity:.9}
  .card:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 12px 28px -12px var(--cc,#000)}
  .card .crow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .card .nm{font-size:16px;font-weight:800;letter-spacing:.2px}
  .card .cls{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--cc);
    padding:3px 8px;border:1px solid var(--cc);border-radius:20px;flex-shrink:0;background:color-mix(in srgb,var(--cc) 12%,transparent)}
  .card .ttl{font-size:12px;color:var(--muted);font-style:italic;margin:2px 0 11px;min-height:17px}
  .card .tiers{display:flex;gap:6px}
  .tbadge{flex:1;text-align:center;border-radius:8px;padding:5px 2px;border:1px solid var(--line);background:var(--bg)}
  .tbadge .lab{font-size:9px;letter-spacing:.5px;color:var(--muted2);text-transform:uppercase;display:block}
  .tbadge .val{font-size:15px;font-weight:900;line-height:1.1}
  .card .facs{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
  .fac{font-size:10px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:2px 7px;border-radius:6px}

  .tier-ss{color:var(--ss)} .tier-s{color:var(--s)} .tier-a{color:var(--a)} .tier-b{color:var(--b)} .tier-c{color:var(--c)} .tier-na{color:var(--muted2)}

  .empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px}

  /* ---------- Table view ---------- */
  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  table.tbl th,table.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
  table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);position:sticky;top:62px;background:var(--bg);z-index:2}
  table.tbl tbody tr{cursor:pointer;transition:.1s}
  table.tbl tbody tr:hover{background:var(--panel)}
  table.tbl td.tier{font-weight:900;text-align:center}
  table.tbl .nm{font-weight:800}
  table.tbl .clsdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(5,6,10,.72);backdrop-filter:blur(4px);z-index:50;
    display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{
    width:min(820px,100%);background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line2);border-radius:18px;overflow:hidden;animation:pop .18s ease;
  }
  @keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .mhead{padding:22px 24px 18px;border-bottom:1px solid var(--line);position:relative;
    background:linear-gradient(120deg,color-mix(in srgb,var(--cc) 16%,transparent),transparent 60%)}
  .mhead .close{position:absolute;top:16px;right:18px;width:32px;height:32px;border-radius:9px;
    border:1px solid var(--line2);background:var(--bg);color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
  .mhead .close:hover{color:#fff;border-color:var(--line2);background:var(--panel)}
  .mhead .mcls{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--cc)}
  .mhead h3{font-size:26px;font-weight:900;margin:3px 0 1px}
  .mhead .mttl{font-size:14px;color:var(--muted);font-style:italic}
  .mhead .mfacs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .mhead .mtiers{display:flex;gap:10px;margin-top:14px}
  .mtiers .mt{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 16px;text-align:center}
  .mtiers .mt .lab{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted2)}
  .mtiers .mt .val{font-size:22px;font-weight:900}

  .mbody{padding:8px 24px 26px}
  .sec{margin-top:20px}
  .sec > .h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);
    margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .sec > .h::after{content:"";flex:1;height:1px;background:var(--line)}
  .notes{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:8px;padding:10px 13px;color:var(--txt);font-size:13.5px}

  .geartbl{width:100%;border-collapse:collapse;font-size:13px;overflow:hidden;border-radius:10px;border:1px solid var(--line)}
  .geartbl td{padding:8px 12px;border-bottom:1px solid var(--line)}
  .geartbl tr:last-child td{border-bottom:none}
  .geartbl .slot{color:var(--muted);width:104px;font-weight:600}
  .geartbl .item{font-weight:700}
  .geartbl .set{color:var(--archer);text-align:right;font-size:12px}

  .kvline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:4px 11px;font-size:12.5px;font-weight:600}
  .chip.sub{border-color:var(--assassin);color:#d7c8ff}
  .relic{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .relic .rname{font-weight:800;color:var(--gold)}
  .relic .rmeta{font-size:12px;color:var(--muted);margin:2px 0 6px}
  .relic .rnote{font-size:13px}

  .tline{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
  .tline:last-child{border-bottom:none}
  .tline .lv{flex-shrink:0;width:42px;height:fit-content;text-align:center;font-size:11px;font-weight:800;
    color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);
    border-radius:7px;padding:3px 0}
  .tline .tx{font-size:13px;color:var(--txt)}

  .skill{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:10px}
  .skill .sh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
  .skill .sn{font-size:15px;font-weight:800}
  .skill .styp{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:6px;
    background:color-mix(in srgb,var(--accent) 16%,transparent);color:#bcd4ff;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
  .skill .scd{font-size:11px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:2px 8px;border-radius:6px;margin-left:auto}
  .skill .sd{font-size:13px;color:#cfd5e4}
  .skill .tldr{display:flex;gap:7px;align-items:baseline;font-size:13px;font-weight:700;color:#ffe9a6;
    background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);
    border-radius:8px;padding:7px 11px;margin-bottom:8px;line-height:1.5}
  .skill .tldr .zz{flex-shrink:0;color:var(--gold)}
  .eff{color:var(--accent2);font-weight:700;background:color-mix(in srgb,var(--accent2) 12%,transparent);
    padding:0 4px;border-radius:4px;white-space:nowrap}

  /* ---------- Responsive ---------- */
  .menuBtn{display:none}
  @media(max-width:860px){
    body{display:block}
    .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.22s;box-shadow:0 0 40px rgba(0,0,0,.6)}
    .sidebar.open{transform:none}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:none}
    .scrim.open{display:block}
    .menuBtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;
      border:1px solid var(--line2);background:var(--panel);color:var(--txt);font-size:18px;cursor:pointer}
    .mtiers .mt{flex:1}
    .mhead h3{font-size:22px}
  }
</style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>Dragon Traveler</h1>
      <span class="sub">Luminaries Database</span>
    </div>
    <div class="langrow">
      <div class="langtoggle" id="langToggle">
        <button data-l="th" class="active">ไทย</button>
        <button data-l="en">EN</button>
      </div>
    </div>
    <div class="search">
      <span class="ic">🔍</span>
      <input id="search" type="text" autocomplete="off">
    </div>
    <div class="navlabel" id="navlabel"></div>
    <nav class="classlist" id="classlist"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="topbar">
      <button class="menuBtn" id="menuBtn">☰</button>
      <h2 id="title">All <span class="pill" id="count">83</span></h2>
      <div class="controls">
        <select id="sort"></select>
        <div class="toggle" id="viewToggle">
          <button data-v="cards" class="active"></button>
          <button data-v="table"></button>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>

 Team 6 | PvP: Team 4, Team 4, Team 5","talentName":"Elephant Binding Dissolution","talentLevels":[{"level":"1","text":"While present, reduces the critical strike damage of all enemy units by 32%. If the critical strike damage from the source of the critical strike is greater than 150%, it will be calculated as 150%."},{"level":"2","text":"Each time you gain [Awakening], reduce the cooldown of all your skills by one second."},{"level":"3","text":"The stealing effect of [Nebula Chains] is increased by 50%."},{"level":"4","text":"At the start of combat, apply the [Nebula Chains] steal effect to the current target, and remove the restriction that [Nebula Chains] can only steal from one target at a time."},{"level":"5","text":"Increases own health by 12% and critical hit damage by 8%."},{"level":"7","text":"Increases own critical hit damage by 20%."}],"skills":[{"name":"Nebula Chains","type":"Overdrive","cd":"20s","desc":"Steal 20% of attack, 20% of both defenses, 300% Crit Rate, 300% Dodge, 300% Block, and 30% Crit Damage from a single target (cannot be applied to bosses), lasting 8 seconds. This effect cannot be stacked and can only be applied to one target at a time. Afterwards, restore 50% of your maximum health and 100% rage, and deal magic damage equal to 880% of your attack to enemy units within a large circular area."},{"name":"Cross Chain Strike","type":"Ultimate Skill","cd":"8s","desc":"Throw the chain into an X-shaped area, crossing at the enemy unit with the highest attack and dealing magic damage equal to 600% of your attack. Each chain also deals magic damage equal to 200% of your attack to any enemy unit it touches. As your health decreases, you accumulate rage. When rage is full, you enter the [Wild] state. In [Wild] state, damage dealt to targets becomes magic damage equal to 600% of your attack + 600% of the target's attack (up to a maximum of 2400% of your attack) and includes a 100% health conversion."},{"name":"Rose Energy Assault","type":"Secret Skill","cd":"","desc":"After each skill is used, the next basic attack is enhanced, dealing magic damage equal to 480% of the user's attack to enemy units within a large circular area and granting the user a shield equal to 20% of their maximum health for 6 seconds, which can stack up to 3 times."},{"name":"Triple Spiral","type":"Special Skill","cd":"12s","desc":"Throw out the spiral lock key, dealing magic damage equal to 550% of your attack to enemy units in a straight line, and granting yourself a shield equal to 10% of your maximum health * your current [Awakening] stacks, lasting for 10 seconds, then consuming all of your [Awakening] stacks. While in the [Wild] state, [Awakening] will not be consumed. Each time our side unleashes an ultimate skill, we gain 1 stack of [Awakening]."},{"name":"The Way of Man","type":"Divine Skill","cd":"","desc":"[Nebula Chains] The duration of the stealing effect is extended by 4 seconds."}],"th":{"title":"เทพีผู้ขโมยไฟ","notes":"ใน PvE ขโมยสเตตัสได้ผลและทำให้ยูนิต Mythic หลายตัวอ่อนลงมาก","talent":[{"level":"1","text":"เมื่ออยู่ในสนาม ลด Crit Damage ของศัตรูทุกตัว 32% ถ้า Crit Damage จากต้นทางมากกว่า 150% จะนับเป็น 150%"},{"level":"2","text":"ทุกครั้งที่ได้ [Awakening] ลด cooldown ของสกิลทั้งหมด 1 วินาที"},{"level":"3","text":"เพิ่มเอฟเฟกต์ขโมยของ [Nebula Chains] 50%"},{"level":"4","text":"ตอนเริ่มต่อสู้ ใส่เอฟเฟกต์ขโมยของ [Nebula Chains] กับเป้าหมายปัจจุบัน และยกเลิกข้อจำกัดที่ [Nebula Chains] ขโมยได้ทีละเป้าหมายเดียว"},{"level":"5","text":"เพิ่ม HP ตัวเอง 12% และ Crit Damage 8%"},{"level":"7","text":"เพิ่ม Crit Damage ตัวเอง 20%"}],"skillDesc":{"Nebula Chains":"ขโมยจากเป้าหมายเดียว: 20% ของ ATK, 20% ของ Defense ทั้งสอง, 300% Crit Rate, 300% Dodge, 300% Block และ 30% Crit Damage (ใช้กับบอสไม่ได้) นาน 8 วินาที สแตกไม่ได้และใช้ได้ทีละเป้าหมายเดียว จากนั้นฟื้น HP 50% ของ Max HP และ Rage 100% สร้างดาเมจเวท 880% ของ ATK ใส่ศัตรูในวงกว้าง","Cross Chain Strike":"ขว้างโซ่เป็นรูปตัว X ตัดกันที่ศัตรูที่ ATK สูงสุด สร้างดาเมจเวท 600% ของ ATK โซ่แต่ละเส้นยังสร้างดาเมจเวท 200% ของ ATK ใส่ศัตรูที่สัมผัส HP ลดสะสม Rage เมื่อเต็มเข้าสถานะ [Wild] ขณะ [Wild] ดาเมจเป็นเวท 600% ของ ATK + 600% ของ ATK เป้าหมาย (สูงสุด 2400% ของ ATK ตัวเอง) และนับ HP 100%","Rose Energy Assault":"หลังใช้สกิลแต่ละครั้ง โจมตีปกติครั้งถัดไปเสริมพลัง สร้างดาเมจเวท 480% ของ ATK ใส่ศัตรูในวงกว้างและได้โล่ 20% ของ Max HP นาน 6 วินาที สแตกสูงสุด 3 ครั้ง","Triple Spiral":"ขว้างกุญแจล็อกเกลียว สร้างดาเมจเวท 550% ของ ATK ใส่ศัตรูแนวตรงและได้โล่เท่ากับ 10% ของ Max HP x จำนวนสแตก [Awakening] ปัจจุบัน นาน 10 วินาที แล้วใช้ [Awakening] ทั้งหมด ขณะอยู่ [Wild] ไม่ใช้ [Awakening] ทุกครั้งที่ฝ่ายเราร่าย Ultimate ได้ [Awakening] 1 สแตก","The Way of Man":"[Nebula Chains] ยืดเวลาเอฟเฟกต์ขโมยออกไปอีก 4 วินาที"},"relicNote":"","skillTldr":{"Nebula Chains":"ขโมย ATK/DEF 20% + Crit/Dodge/Block 300% จากเป้า 8 วิ + ฟื้น 50% HP + ดาเมจ 880% ATK วงกว้าง","Cross Chain Strike":"ขว้างโซ่รูป X ใส่เป้า ATK สูงสุด 600% ATK ([Wild] +600% ATK เป้า สูงสุด 2400%)","Rose Energy Assault":"หลังใช้สกิล ตีปกติเสริม 480% ATK วงกว้าง + โล่ 20% Max HP 6 วิ สูงสุด 3 stack","Triple Spiral":"ขว้างโซ่ดาเมจ 550% ATK แนวตรง + โล่ 10% Max HP ต่อ [Awakening] stack 10 วิ","The Way of Man":"[Nebula Chains] ยืดเวลาขโมยอีก 4 วิ"}}},{"slug":"salome","klass":"guardian","name":"Salome","classLabel":"Guardian","title":"Seven-Veil Dancer","tags":["Elemental Echo","Otherworld Return"],"rat":{"Overall":"S+","PvE":"S+","PvP":"S+"},"notes":"","gear":[{"slot":"Headgear","item":"Flamelord's Helmet","set":"HP Set"},{"slot":"Chestplate","item":"Flamelord's Armor","set":"HP Set"},{"slot":"Bracers","item":"Flamelord's Gauntlets","set":"HP Set"},{"slot":"Boots","item":"Flamelord's Boots","set":"HP Set"},{"slot":"Weapon","item":"Flamelord's Sword","set":"HP Set"},{"slot":"Accessory","item":"Spirit Turtle Talisman","set":"Longevity Set"}],"subclasses":["Templar","Guardian"],"relic":null,"teams":"PvE: Team 3, Team 4 | PvP: Team 2, Team 3","talentName":"Illusory Dance","talentLevels":[{"level":"1","text":"Du s 1 stack of [Mystic Sun], stacking up to 8 times for 10 seconds. Each stack of [Mystic Sun] increases Physical Defense and Magic Defense by 7-10.6% and Block by 100-190. When Xuanwu's active skill deals damage, it also applies [Mystic Moon], stacking up to 6 times for 10 seconds. Each stack of [Mystic Moon] reduces the target's Break by 100-160. Whenever an enemy with [Mystic Moon] deals non-Overdrive damage to an ally with [Mystic Sun], that ally temporarily gains 5% x ([Mystic Sun] stacks + [Mystic Moon] stacks) Damage Reduction."},{"level":"2","text":"When an allied Luminary enters [Divine Gift], reduces the cooldown of [Mortal Veil] by 4 seconds."},{"level":"3","text":"Increases own Physical Defense and Magic Defense by 10% and HP by 5%."},{"level":"4","text":"When Xuanwu grants a shield to an ally, additionally applies 1 stack of [Mystic Sun] to that unit. ([Mystic Sun] applied to allies is considered a buff.)"},{"level":"7","text":"At the start of battle, applies 3 stacks of [Mystic Sun] to all allied Luminaries."}],"skills":[{"name":"Unbroken Flow","type":"Overdrive","cd":"20s","desc":"Can select 1 melee ally. Leaps to the target location, dealing physical damage equal to 600-990% of own Attack to enemy units within an extra-large circular area around the target, and knocking enemies within the large inner circular area into the air. Then grants self and the selected ally a shield equal to 35-56% of own Max HP for 20 seconds. Or, can select 1 ranged ally. Leaps to the nearest enemy, dealing physical damage equal to 600-990% of own Attack to enemies within an extra-large circular area around the target and inflicting [Taunt] on the nearest enemy for 10 seconds. Then grants self and the selected ally a shield equal to 35-56% of own Max HP for 20 seconds."},{"name":"Mortal Veil","type":"Ultimate Skill","cd":"12s","desc":"Enters Parasol Stance for 5 seconds, dealing physical damage equal to 60-87% of own Attack + 10% of own current shield value to enemies within a medium circular area around self every 0.5 seconds. When possessing both [Morale] and [Fighting Spirit], enters [Divine Gift]. While in [Divine Gift], this skill additionally grants allied Luminaries or Wyrms within the medium circular area a shield equal to 22-37% of own HP. Immune to control effects while casting this skill, and removes [Divine Gift] when the skill ends."},{"name":"Dance of Duality","type":"Secret Skill","cd":"","desc":"All allies gain 10-16% Damage Reduction while they have a shield. If they have a shield granted by Xuanwu, they gain an additional 10-16% Damage Reduction. In battle, every 10 seconds, grants a random [Blessing Buff] to an allied Luminary with a shield, prioritizing one they do not already have."},{"name":"Mystic Beacon","type":"Special Skill","cd":"16s","desc":"Throws a parasol at the allied Luminary with the highest Attack, prioritizing ranged units, or at an allied Wyrm. When the parasol reaches the target, grants allies within a medium circular area a shield equal to 20-35% of own Max HP. The parasol remains on the battlefield for 8 seconds, granting 20-32 Haste to allies within a medium circular area around it. Each time an ally unleashes an Overdrive, self gains 1 stack of [Awakening]. For each stack of [Awakening] self has, the shield value granted by [Mystic Beacon] increases by 5%."},{"name":"Eclipse Rebirth","type":"Divine Skill","cd":"","desc":"When a shield granted by Xuanwu's active skill during [Eclipse Rebirth] is broken, additionally restores HP to the shield holder equal to 30% of their Max HP and applies [Significant Physical Defense Boost]."}],"th":{"title":"วิญญาณเต่าดำ (เสวียนอู่)","notes":"การ์เดียน SSR+ จาก Four Saints ให้โล่กับเพื่อน มีกลไกสะสม Mystic Sun/Moon สำหรับ defense และ damage reduction","talent":[{"level":"1","text":"ทุกครั้งที่ Xuanwu ให้โล่เพื่อน ได้ [Mystic Sun] 1 สแตก สูงสุด 8 ครั้ง นาน 10 วินาที แต่ละสแตกเพิ่ม Physical/Magic Defense 7-10.6% และ Block 100-190 เมื่อสกิลแอ็กทีฟสร้างดาเมจ ติด [ บ 30% ของ Max HP และให้ [Significant Physical Defense Boost]"},"relicNote":"","skillTldr":{"Unbroken Flow":"พุ่งใส่เป้า ดาเมจ 990% ATK วงใหญ่มาก (ลอย/[Taunt]) + โล่ตัวเอง+เพื่อน 56% Max HP 20 วิ","Mortal Veil":"Parasol Stance 5 วิ ดาเมจ 87% ATK + 10% ค่าโล่ ทุก 0.5 วิ ([Divine Gift] แถมโล่ 37% HP)","Dance of Duality":"ทีมมีโล่ลดดาเมจ 16% (โล่จาก Xuanwu +16%) + แจก [Blessing Buff] ทุก 10 วิ","Mystic Beacon":"ขว้างร่มให้เพื่อน ATK สูงสุด โล่ 35% Max HP วงกลาง + Haste 32 8 วิ ([Awakening] เพิ่มโล่)","Eclipse Rebirth":"[Eclipse Rebirth] โล่จาก Xuanwu แตก = ฟื้น 30% Max HP + [Significant Physical Defense Boost]"}}},{"slug":"atanith","klass":"priest","name":"Atanith","classLabel":"Priest","title":"Arcane Lord","tags":["Illusion Veil","Arcane Wisdom"],"rat":{"Overall":"S","PvE":"SS","PvP":"A"},"notes":"Interrupt, silence, and mana boost all-in-one; winning the first move gives a big advantage.","gear":[{"slot":"Headgear","item":"Arcane Hood","set":"Haste Set"},{"slot":"Chestplate","item":"Arcane Robe","set":"Haste Set"},{"slot":"Bracers","item":"Arcane Gauntlets","set":"Haste Set"},{"slot":"Boots","item":"Arcane Boots","set":"Haste Set"},{"slot":"Weapon","item":"Tome of Stars","set":"Arcane Set"},{"slot":"Accessory","item":"Starlight Magisterium","set":"Arcane Set"}],"subclasses":["High Priest","Executor"],"relic":null,"teams":"PvE: Team 1, Team 2, Team 4, Team 1, Team 2, Team 4, Team 5, Team 6, Team 7 | PvP: Team 1, Team 2, Team 3, Team 5, Team 6, Team 7, Team 9, Team 2, Team 1, Team 3, Team 5","talentName":"Cursed Domain","talentLevels":[{"level":"1","text":"At the start of battle, increases the Overdrive Energy cost of the nearest enemy Luminary by 1 and reduces their Magic Defense by 20%. This effect is dispelled after the Arcane Lord is defeated."},{"level":"2","text":"The Healing effect of [Mana Surge] is increased by 30%."},{"level":"3","text":"Increases HP by 15%."},{"level":"4","text":"After the target of [Cursed Domain] is defeated, [Cursed Domain] is cast again in","title":"Flame Rider","tags":["Elemental Echo","Illusion Veil"],"rat":{"Overall":"S","PvE":"S","PvP":"S"},"notes":"Fire-based assassin who creates a Fire Stone Field and synergizes with Burn teams. Rides a hoverboard when at full energy, dealing AoE magic damage.","gear":[{"slot":"Headgear","item":"Paladin's Helmet","set":"Crit Damage Set"},{"slot":"Chestplate","item":"Paladin's Armor","set":"Crit Damage Set"},{"slot":"Bracers","item":"Paladin's Gauntlets","set":"Crit Damage Set"},{"slot":"Boots","item":"Paladin's Boots","set":"Crit Damage Set"},{"slot":"Weapon","item":"Ship Slayer","set":"Impact Set"},{"slot":"Accessory","item":"Eagle Warrior Portrait","set":"Judgment Set"}],"subclasses":["Executioner"],"relic":null,"teams":"","talentName":"Flame Tail Glide","talentLevels":[{"level":"1","text":"Starts with a maximum of 100 energy. Each time an ally triggers [Burn], Hermes gains 8 energy. If Hermes himself triggers it, he gains an additional 8 energy. When at full energy, Hermes rides his hoverboard through the air until energy is depleted, consuming 12 energy per second. Every 0.5 seconds, deals magic damage equal to 940% of his attack to nearby enemies in a small circular area around him and knocks them back slightly."},{"level":"2","text":"While gliding on the hoverboard, automatically casts [Molten Rock Burst] on the nearest enemy every 5 seconds."},{"level":"3","text":"Starts the battle at full energy. Whenever an enemy on the Fire Stone Field triggers an [Elemental Reaction], Hermes becomes untargetable for 4 seconds."},{"level":"4","text":"[Flame Field Punishment] clears the target's shields each time a [Punish] effect is triggered."},{"level":"5","text":"Increases own crit rate by 100 and crit damage by 9%."},{"level":"7","text":"Increases own crit damage by 18%."}],"skills":[{"name":"Fire Stone Field","type":"Overdrive","cd":"18s","desc":"Forms a trapezoidal Fire Stone Field in front of him, dealing magic damage equal to 1260% of his attack to enemies and applying [Burn]. The Fire Stone Field lasts 7.5 seconds. Enemies inside the field have their healing received reduced by 80% and their crit resistance reduced by 500."},{"name":"Molten Rock Burst","type":"Ultimate Skill","cd":"12s","desc":"Summons a rock burst at the target location, dealing magic damage equal to 820% of his attack, launching enemies into the air and applying [Burn]. Has a 50% chance to inflict [Next Ultimate Cost +1] on the target."},{"name":"Flame Field Punishment","type":"Secret Skill","cd":"","desc":"When enemies standing on the Fire Stone Field are forcibly displaced (pulled, knocked back, or launched), deals additional magic damage equal to 1200% of his attack to them (triggers at most once per second per target). This damage can trigger the [Punish] effect. When [Punish] is triggered, ignores 40% of the target's magic defense."},{"name":"Overheat","type":"Special Skill","cd":"","desc":"During battle, increases own attack by 20% and crit damage by 20%. Each time an ally triggers [Burn] or [Punish], the trigger gains one stack of [Scorching Pulse]. Each stack permanently increases the holder's attack by 1% and crit damage by 1%, up to a maximum of 20 stacks."},{"name":"Molten Hell Burst","type":"Divine Skill","cd":"","desc":"Each time [Molten Rock Burst] releases a rock burst, it additionally selects 1 extra target to release on."}],"th":{"title":"นักขี่เปลวเพลิง","notes":"Assassin สายไฟที่สร้าง Fire Stone Field และเข้าทีมสาย Burn ได้ดี ขี่โฮเวอร์บอร์ดตอนพลังงานเต็ม สร้างดาเมจเวท AoE","talent":[{"level":"1","text":"เริ่มด้วยพลังงานสูงสุด 100 ทุกครั้งที่เพื่อนทริกเกอร์ [Burn] Hermes ได้พลังงาน 8 ถ้าตัวเองเป็นคนทริกเกอร์ได้เพิ่มอีก 8 พอพลังงานเต็มจะขี่โฮเวอร์บอร์ดบินจนพลังงานหมด เปลือง 12 ต่อวินาที ทุก 0.5 วิ สร้างดาเมจเวท 940% ของ ATK ใส่ศัตรูในวงเล็กรอบตัวและกระแทกถอยเล็กน้อย"},{"level":"2","text":"ขณะขี่โฮเวอร์บอร์ด ร่าย [Molten Rock Burst] ใส่ศัตรูที่ใกล้ที่สุดอัตโนมัติทุก 5 วินาที"},{"level":"3","text":"เริ่มสู้ด้วยพลังงานเต็ม ทุกครั้งที่ศัตรูบน Fire Stone Field ทริกเกอร์ [Elemental Reaction] Hermes จะถูกเล็งเป้าไม่ได้ 4 วินาที"},{"level":"4","text":"[Flame Field Punishment] ล้างโล่ของเป้าทุกครั้งที่ทริกเกอร์เอฟเฟกต์ [Punish]"},{"level":"5","text":"เพิ่ม Crit rate ตัวเอง 100 และ Crit damage 9%"},{"level":"7","text":"เพิ่ม Crit damage ตัวเอง 18%"}],"skillDesc":{"Fire Stone Field":"สร้าง Fire Stone Field รูปสี่เหลี่ยมคางหมูข้างหน้า สร้างดาเมจเวท 1260% ของ ATK ใส่ศัตรูและติด [Burn] สนามอยู่ได้ 7.5 วินาที ศัตรูในสนามรับการฟื้น HP ลดลง 80% และ Crit resistance ลดลง 500","Molten Rock Burst":"เรียกหินระเบิดที่จุดเป้า สร้างดาเมจเวท 820% ของ ATK เหวี่ยงลอยและติด [Burn] มีโอกาส 50% ติด [Next Ultimate Cost +1] ใส่เป้า","Flame Field Punishment":"เมื่อศัตรูที่ยืนบน Fire Stone Field ถูกบังคับให้เคลื่อนที่ (ดึง, กระแทก, เหวี่ยงลอย) สร้างดาเมจเวทเพิ่ม 1200% ของ ATK (ทริกเกอร์ได้มากสุด 1 ครั้ง/วิ/เป้า) ดาเมจนี้ทริกเกอร์เอฟเฟกต์ [Punish] ได้ พอ [Punish] ทำงานจะมองข้าม Magic defense ของเป้า 40%","Overheat":"ระหว่างสู้ เพิ่ม ATK ตัวเอง 20% และ Crit damage 20% ทุกครั้งที่เพื่อนทริกเกอร์ [Burn] หรือ [Punish] คนนั้นจะได้ [Scorching Pulse] 1 stack แต่ละ stack เพิ่ม ATK 1% และ Crit damage 1% ถาวร สูงสุด 20 stack","Molten Hell Burst":"ทุกครั้งที่ [Molten Rock Burst] ปล่อยหินระเบิด จะเลือกเป้าเพิ่มอีก 1 ตัวให้ปล่อยใส่ด้วย"},"relicNote":"","skillTldr":{"Fire Stone Field":"สร้างสนามไฟ ดาเมจ 1260% ATK + [Burn] 7.5 วิ ลดฮีลเป้า 80% + crit res -500","Molten Rock Burst":"หินระเบิดใส่จุดเป้า 820% ATK + ลอย + [Burn] 50% ติด [Next Ultimate Cost +1]","Flame Field Punishment":"เป้าในสนามไฟโดนผลักรับ 1200% ATK + trigger [Punish] ทะลุ magic def 40%","Overheat":"บัฟตัวเอง ATK +20% crit dmg +20% + สะสม [Scorching Pulse] ทีม Burn สูงสุด 20 stack","Molten Hell Burst":"[Molten Rock Burst] ระเบิดเพิ่มอีก 1 เป้า"}}},{"slug":"jormungandr","klass":"assassin","name":"Jormungandr","classLabel":"Assassin","title":"World Serpent","tags":["Sanctum Glory","Illusion Veil"],"rat":{"Overall":"B","PvE":"B","PvP":"B"},"notes":"Cheap to build during the New Year event. With Lake Lady, can achieve the highest single-hit damage output for assassins.","gear":[{"slot":"Headgear","item":"Dragon Hunter Helmet","set":"Attack Set"},{"slot":"Chestplate","item":"Dragon Hunter Armor","set":"Attack Set"},{"slot":"Bracers","item":"Dragon Hunter Gauntlets","set":"Attack Set"},{"slot":"Boots","item":"Dragon Hunter Boots","set":"Attack Set"},{"slot":"Weapon","item":"Last Whisper","set":"Penetration Set"},{"slot":"Accessory","item":"Eagle Warrior Portrait","set":"Judgment Set"}],"subclasses":["Executioner"],"relic":{"name":"Ring of Demon Blade","tier":"PVP: C | PVE: S","priority":"Must get 3 copies","note":"Divine Seed 3 grants exceptional light damage boost. Requires exclusive weapon and artifact for one-shot boss burst potential. Not suitable for PVP due to lack of control immunity and invincibility."},"teams":"PvP: Team 1, Team 1","talentName":"Ravaging Maw","talentLevels":[{"level":"1","text":"Every 9 seconds, deals physical damage to the current target equal to 50% of Attack + 35% of the target's lost HP (damage from lost HP cannot exceed 350% of Attack). When possessing both [Morale] and [Fervor], enters the [Grace] status. While in the [Grace] status, this skill's damage increases to 50% of Attack + 70% of the target's lost HP (damage from lost HP cannot exceed 700% of Attack)."},{"level":"2","text":"After [Ravaging Maw] Crits, reduces the Cooldown of all skills by 2 seconds."},{"level":"3","text":"Increases Attack by 10% and Crit by 50."},{"level":"4","text":"When scoring a kill, grants [Morale] to self and 2 random allied Luminaries (prioritizes Sanctum Glory faction members)."},{"level":"7","text":"[Ravaging Maw] Changed to trigger once every 6 seconds."}],"skills":[{"name":"Titancoil Domain","type":"Overdrive","cd":"18s","desc":"After selecting a target, launches them into the air, and deals physical damage equal to 410% of Attack. After this, deals physical damage equal to 240% of Attack to enemies within a large circular area around the target, and additionally deals 2x the damage of [Ravaging Maw] to the selected target."},{"name":"Venombrand","type":"Ultimate Skill","cd":"10s","desc":"Fiercely whips forward, dealing physical damage equal to 150% of Attack to enemies in a straight line. This skill can trigger the [Punishment] effect. When [Punishment] is triggered, deals additional damage equal to 0.8x the damage of [Ravaging Maw] and applies [Healing Down]."},{"name":"Chaos Banquet","type":"Secret Skill","cd":"","desc":"In battle, increases Attack by 8%. When unleashing an Overdrive or triggering the [Punishment] effect, gains [Morale]."},{"name":"Bladescale Dance","type":"Special Skill","cd":"16s","desc":"Pummels a single target, dealing physical damage equal to 320% of Attack and inflicting [Physical Defense Down]."},{"name":"Ten Thousand Snakes Eat Bones","type":"Divine Skill","cd":"","desc":"[Ravaging Maw] After defeating the target, immediately use [Ravaging Maw] again on the enemy Luminary with the lowest health."}],"th":{"title":"งูแห่งโลก","notes":"สร้างถูกช่วงอีเวนต์ปีใหม่ จับคู่กับ Lake Lady แล้วทำดาเมจต่อหนึ่งหมัดสูงสุดในกลุ่ม Assassin","talent":[{"level":"1","text":"ทุก 9 วินาที สร้างดาเมจกายภาพใส่เป้าปัจจุบัน เท่ากับ 50% ของ ATK + 35% ของ HP ที่เป้าเสียไป (ส่วนจาก HP ที่เสียเกิน 350% ของ ATK ไม่ได้) เมื่อมีทั้ง [Morale] และ [Fervor] เข้าสู่สถานะ [Grace] ในสถานะนี้ดาเมจเพิ่มเป็น 50% ของ ATK + 70% ของ HP ที่เป้าเสีย (ส่วนจาก HP เสียเกิน 700% ของ ATK ไม่ได้)"},{"level":"2","text":"หลัง [Ravaging Maw] คริติคอล ลด CD ของสกิลทั้งหมด 2 วินาที"},{"level":"3","text":"เพิ่ม ATK 10% และ Crit 50"},{"level":"4","text":"เมื่อฆ่าศัตรูได้ มอบ [Morale] ให้ตัวเองและเพื่อนสุ่ม 2 ตัว (เน้นสมาชิก faction Sanctum Glory ก่อน)"},{"level":"7","text":"[Ravaging Maw] เปลี่ยนเป็นทริกเกอร์ทุก 6 วินาทีแทน"}],"skillDesc":{"Titancoil Domain":"เลือกเป้าแล้วเหวี่ยงลอย สร้างดาเมจกายภาพ 410% ของ ATK จากนั้นสร้างดาเมจกายภาพ 240% ของ ATK ใส่ศัตรูในวงกว้างรอบเป้า และสร้างดาเมจเพิ่มใส่เป้าที่เลือกเท่ากับ 2 เท่าของ [Ravaging Maw]","Venombrand":"ฟาดไปข้างหน้า สร้างดาเมจกายภาพ 150% ของ ATK ใส่ศัตรูเป็นแนวตรง ทริกเกอร์เอฟเฟกต์ [Punishment] ได้ พอ [Punishment] ทำงานจะสร้างดาเมจเพิ่ม 0.8 เท่าของ [Ravaging Maw] และติด [Healing Down]","Chaos Banquet":"ระหว่างสู้ เพิ่ม ATK 8% เมื่อปล่อย Overdrive หรือทริกเกอร์ [Punishment] จะได้ [Morale]","Bladescale Dance":"รัวใส่เป้า 1 ตัว สร้างดาเมจกายภาพ 320% ของ ATK และติด [Physical Defense Down]","Ten Thousand Snakes Eat Bones":"[Ravaging Maw] หลังฆ่าเป้าได้ ใช้ [Ravaging Maw] ซ้ำทันทีใส่ศัตรู Luminary ที่ HP ต่ำสุด"},"relicNote":"Divine Seed 3 เพิ่มดาเมจสายแสงได้เยอะมาก ต้องมีอาวุธและอาร์ติแฟกต์เฉพาะตัวเพื่อทำเบิร์สต์วันชอตบอส ไม่เหมาะกับ PVP เพราะไม่มีภูมิคุ้มกัน CC และอมตะ","skillTldr":{"Titancoil Domain":"ลอยเป้า 410% ATK + AoE 240% ATK + ฟัน [Ravaging Maw] 2x ใส่เป้าหลัก","Venombrand":"ฟาดแนวตรง 150% ATK trigger [Punishment] บวก 0.8x [Ravaging Maw] + [Healing Down]","Chaos Banquet":"ATK +8% + ใช้ Overdrive/trigger [Punishment] ได้ [Morale]","Bladescale Dance":"รัวเป้าเดี่ยว 320% ATK + [Physical Defense Down]","Ten Thousand Snakes Eat Bones":"[Ravaging Maw] ฆ่าเป้าได้ ยิงซ้ำใส่ศัตรู HP ต่ำสุดทันที"}}},{"slug":"lancelot","klass":"assassin","name":"Lancelot","classLabel":"Assassin","title":"Knight of the Lake","tags":["Sanctum Glory","Elemental Echo"],"rat":{"Overall":"C","PvE":"C","PvP":"C"},"notes":"","gear":[{"slot":"Headgear","item":"Paladin's Helmet","set":"Crit Damage Set"},{"slot":"Chestplate","item":"Paladin's Armor","set":"Crit Damage Set"},{"slot":"Bracers","item":"Paladin's Gauntlets","set":"Crit Damage Set"},{"slot":"Boots","item":"Paladin's Boots","set":"Crit Damage Set"},{"slot":"Weapon","item":"Last Whisper","set":"Penetration Set"},{"slot":"Accessory","item":"Eagle Warrior Portrait","set":"Judgment Set"}],"subclasses":[],"relic":null,"teams":"","talentName":"Long March","talentLevels":[{"level":"1","text":"The farther the total distance moved this battle, the higher Damage Amplification becomes, up to a maximum increase of 40%."},{"level":"2","text":"[Solar Steed] Inflicts [Shock] on enemy units it collides with."},{"level":"3","text":"Increases own Attack by 15%."},{"level":"4","text":"Each time self triggers an [Elemental Reaction], reduces the Cooldown of [Solar Steed] by 2 seconds."},{"level":"7","text":"While in the [Grace] status, the damage bonus of [Long March] is doubled."}],"skills":[{"name":"Solar Steed","type":"Overdrive","cd":"18s","desc":"Gains [Morale], then charges at a single target, dealing physical damage equal to 110% of Attack to enemies along the way. After this, deals physical damage equal to 220% of Attack to enemies within a medium circular area around the target."},{"name":"Piercing Gale","type":"Ultimate Skill","cd":"7s","desc":"Unleashes a flurry of consecutive thrusts at enemies in a medium cone-shaped area, dealing physical damage equal to 225% of Attack in total."},{"name":"Chivalry","type":"Secret Skill","cd":"","desc":"Increases Crit by 350. When possessing both [Morale] and [Fervor], enters the [Grace] status. While in the [Grace] status, each critical hit reduces the cooldown of [Solar Steed] by 1 second."},{"name":"Lightwall","type":"Special Skill","cd":"","desc":"Upon entering the [Grace] status, instantly dispels all debuffs from self and reduces the cooldown of [Solar Steed] by 14s."}],"th":{"title":"อัศวินแห่งทะเลสาบ","notes":"","talent":[{"level":"1","text":"ยิ่งเดินไกลรวมในการต่อสู้นี้มากเท่าไหร่ Damage Amplification ยิ่งสูง สูงสุดเพิ่ม 40%"},{"level":"2","text":"[Solar Steed] ติด [Shock] ใส่ศัตรูที่พุ่งชน"},{"level":"3","text":"เพิ่ม ATK ตัวเอง 15%"},{"level":"4","text":"ทุกครั้งที่ตัวเองทริกเกอร์ [Elemental Reaction] ลด CD ของ [Solar Steed] 2 วินาที"},{"level":"7","text":"ในสถานะ [Grace] โบนัสดาเมจจาก [Long March] เพิ่มเป็นสองเท่า"}],"skillDesc":{"Solar Steed":"ได้ [Morale] แล้วพุ่งชนเป้า 1 ตัว สร้างดาเมจกายภาพ 110% ของ ATK ใส่ศัตรูระหว่างทาง จากนั้นสร้างดาเมจกายภาพ 220% ของ ATK ใส่ศัตรูในวงกลางรอบเป้า","Piercing Gale":"แทงรัวติดกันใส่ศัตรู lentName":"Niten Ichiryu","talentLevels":[{"level":"1","text":"Whenever an allied unit is defeated, gain 1 stack of [Deathrattle]. When a skill deals a critical hit, it grants [Morale] to the user and one allied Luminary of the Holy Glory faction with the highest attack. When the [Sword Clone] basic attack deals a critical hit, it grants one stack of [Deathrattle] to the user and one allied Luminary of the Otherworldly Descent faction with the highest attack. During battle, increases own evasion by 300/350/400/450/500/550/600. For each stack of [Deathrattle], increases own evasion by an additional 30/35/40/45/50/55/60."},{"level":"2","text":"When in the [Grace] state, the shield value provided by energy is doubled."},{"level":"3","text":"Increases attack by 10% and critical hit chance by 50%."},{"level":"4","text":"When applying [Morale] or [Deathrattle] with [Niten Ichiryu], select an additional target."},{"level":"7","text":"Each time [Phantom Martial Soul] is released, the [Increased Energy Cost for Next Ultimate Skill] effect is removed. When [Swallow Return] deals damage, [Two Heavens Imprint] is applied."}],"skills":[{"name":"Swallow Return","type":"Overdrive","cd":"18s","desc":"She instantly slashes twice at enemy units within a rectangular area, dealing physical damage equal to 650%/715%/780%/845%/910%/975% of her attack respectively, and applying a pulling effect twice to a single target at the end of each slash. The user is untargetable during the skill's activation."},{"name":"Phantom Martial Soul","type":"Ultimate Skill","cd":"20s","desc":"The effect of releasing it varies depending on whether there is a [Sword Clone] on the field. When no [Sword Clone] exists, summon a [Sword Clone] (maximum 1 can exist on the field) and then retreat. When the [Sword Clone] is created, it applies a 3-second Taunt to enemy units within a large circular area, while the clone becomes untargetable for 3 seconds. The [Sword Clone] inherits 75%/80%/85%/90%/95%/100% of the clo al damage equal to 120% of missing health. Each time an ally unleashes an ultimate skill, gains 1 stack of [Awakening]. For each stack of [Awakening], the additional damage of Unyielding Body is increased by 10%."},{"name":"Rock Cone Ground Fissure","type":"Special Skill","cd":"14s","desc":"A Ground Fissure is created beneath the two enemy units with the lowest health. Every 3 seconds, the Ground Fissure deals physical damage equal to 480% of Attack. If current health is above 70%, consume 50% of current health, and for the next 8 seconds the Ground Fissure gains 100% lifesteal."},{"name":"Trial Champion","type":"Divine Skill","cd":"","desc":"[Twelve Trials] Immediately gain 6 stacks of [Trial's Gift] at the start of battle."}],"th":{"title":"ผู้พิชิตสิบสองภารกิจ","notes":"วอริเออร์สายรอยแยกพื้นดิน (Ground Fissure) ระเบิด AoE มหาศาล สะสม Trial เพิ่มความอึด และดาเมจสเกลตาม HP ที่หายไป subclass Berserker เป็นตัวเด่นระดับท็อปใน PvP","talent":[{"level":"1","text":"เมื่อ HP ของ Hercules \u003c=80% ของ HP สูงสุด ได้ [Trial's Gift] 1 ชั้นต่อวิ ซ้อนได้ 12 ชั้น แต่ละชั้นให้ damage reduction 3.2% ประสิทธิภาพโล่ 2.1% และ healing ที่รับ 2.1% เมื่อ HP ลดสะสม rage พอเต็มเข้า [Wild] เมื่อ HP \u003c=50% และอยู่ [Wild] ได้ [Trial's Gift] เพิ่มอีก 2 ชั้นต่อวิ"},{"level":"2","text":"ทุกครั้งที่ได้รับ [Trial's Gift] ลบ [Next Ultimate Skill Cost +1] ของเพื่อน 1 ตัว"},{"level":"3","text":"[Ground Fissure] ลด CD ของ ultimate ของผู้ใช้และ Luminary สาย ranged ที่ ATK สูงสุด 1 วิ หลังทำดาเมจแต่ละครั้ง (สูงสุด 1 ครั้งต่อ 3 วิ)"},{"level":"4","text":"เมื่อกำลังจะรับดาเมจถึงตาย ถ้า [Trial's Gift] ครบ 12 ชั้น จะใช้ทุกชั้นเพื่อ immune ต่อการคุมและดาเมจ 5 วิ และฟื้น HP 18% ของ HP สูงสุด 6 ครั้ง (สูงสุด 3 ครั้งต่อการต่อสู้)"},{"level":"5","text":"เพิ่ม HP ตัวเอง 8% และ crit chance 120"},{"level":"7","text":"เพิ่ม crit chance ตัวเอง 200"}],"skillDesc":{"Mighty Collapse":"กระโดดไปยังตำแหน่งเป้า สร้างดาเมจกายภาพ 980% ของ ATK ในวงกลมขนาดกลางและ stun 2 วิ แล้วสร้างรอยแยกพื้นดินที่จุดลง ทุก 3 วิ รอยแยกสร own]. When your own HP is greater than 70%, when releasing the skill, it will consume an additional 30% of your current HP, randomly grant you 1 [Blessing Buff], and increase the damage of the magic orb to 150% of your own attack and add 100% HP conversion."},{"name":"Divine Fox Blessing","type":"Secret Skill","cd":"","desc":"During combat, increases own magic defense by 30%. When the user's active skill deals damage, it deals additional magic damage equal to 80% of the user's magic defense. When you possess both [Morale] and [Fervor], you enter the [Grace] state. While in the [Grace] state, Foxfire Dance deals additional magic damage equal to 60% of your magic defense. You exit the [Grace] state after Foxfire Dance ends."},{"name":"Nine-Tailed Bewitching","type":"Special Skill","cd":"18s","desc":"Fires 6 magic projectiles at the current target, each dealing 70% of the caster's attack as magic damage and having a 15% chance to inflict Charm on the target for 5 seconds. When successfully Charming an enemy unit, gains 1 random [Blessing Buff] (can only be triggered once every 8 seconds). While under the [Grace] buff, fires an additional 6 magic projectiles."},{"name":"Soul Devouring","type":"Divine Skill","cd":"","desc":"[Soul Stealing] — When the current target's [Foxfire Bind] reaches full stacks, Tamamo gains [Attack Speed Boost] and [Significant Attack Boost]."}],"th":{"title":"จิ้งจอกเก้าหาง","notes":"เมจวิญญาณจิ้งจอกที่สะสม debuff [Foxfire Bind] ขโมย magic def และ ultimate damage จากเป้า ได้โล่และฟื้น rage เมื่อ stack เต็ม เก่งในการต่อสู้ยืดเยื้อด้วยดาเมจเวทต่อเนื่องและเลี้ยงตัวเอง","talent":[{"level":"1","text":"เมื่อสกิล active ของ Tamamo ทำดาเมจใส่เป้าปัจจุบัน มี 30% ที่จะใส่ [Foxfire Bind] 1 stack ผล stack ได้สูงสุด 10 ครั้ง แต่ละ stack ขโมย magic def ของเป้า 4% (ใช้กับบอสไม่ได้). เมื่อสลับเป้า [Foxfire Bind] ทั้งหมดจะหายไป"},{"level":"2","text":"โอกาสจุด [Foxfire Bind] เพิ่มเป็น 50% และแต่ละ stack ขโมย ultimate damage ของเป้าเพิ่ม 5%"},{"level":"3","text":" const CLR = {guardian:'#38bdf8',priest:'#34d399',assassin:'#a78bfa',warrior:'#f87171',archer:'#fbbf24',mage:'#f472b6'};
const CLASS_KEYS = ['guardian','priest','assassin','warrior','archer','mage'];
const CLASS_LABEL = {guardian:'Guardian',priest:'Priest',assassin:'Assassin',warrior:'Warrior',archer:'Archer',mage:'Mage'};
const TIER_RANK = {'SS':100,'S+':92,'S':90,'A+':82,'A':80,'A-':78,'B+':72,'B':70,'B-':68,'C+':62,'C':60,'D':40,'':0};

const I18N = {
  th:{
    searchPh:'ค้นหาชื่อ / ฉายา / faction / skill...', info:'ข้อมูลตัวละคร', all:'ทั้งหมด', allTitle:'ตัวละครทั้งหมด',
    cards:'การ์ด', table:'ตาราง', colChar:'ตัวละคร', colClass:'คลาส', colTitle:'ฉายา',
    ovr:'ภาพรวม', gear:'ไอเทมแนะนำ', build:'บิลด์', talent:'พรสวรรค์', skills:'สกิล',
    subclass:'ซับคลาส', teams:'ทีมแนะนำ', relic:'อาวุธ/เรลิคเฉพาะตัว', priority:'ความสำคัญ',
    sortOverall:'เรียง: ภาพรวม ▼', sortPve:'เรียง: PvE ▼', sortPvp:'เรียง: PvP ▼', sortName:'เรียง: ชื่อ A→Z',
    empty:'ไม่เจอตัวละครที่ตรงกับ', foot:'ข้อมูล: hideoutgacha.com<br>83 ตัวละคร · 6 คลาส · สรุปไทยโดย AI<br>อัปเดต 2026-06-06',
  },
  en:{
    searchPh:'Search name / title / faction / skill...', info:'Luminaries Information', all:'All', allTitle:'All Luminaries',
    cards:'Cards', table:'Table', colChar:'Character', colClass:'Class', colTitle:'Title',
    ovr:'Overall', gear:'Recommended Gear', build:'Build', talent:'Talent', skills:'Skills',
    subclass:'Subclass', teams:'Suggested Teams', relic:'Exclusive Relic', priority:'Priority',
    sortOverall:'Sort: Overall ▼', sortPve:'Sort: PvE ▼', sortPvp:'Sort: PvP ▼', sortName:'Sort: Name A→Z',
    empty:'No characters match', foot:'Source: hideoutgacha.com<br>83 Luminaries · 6 Classes · Scraped 2026-06-06',
  }
};
const TYPE_TH = {'Overdrive':'โอเวอร์ไดรฟ์','Ultimate Skill':'อัลติเมท','Secret Skill':'สกิลลับ','Special Skill':'สกิลพิเศษ','Divine Skill':'สกิลศักดิ์สิทธิ์','Passive Skill':'สกิลติดตัว','Leader Skill':'สกิลหัวหน้า'};

const state = {klass:'all', q:'', sort:'overall', view:'cards', lang:'th'};
const T = k => I18N[state.lang][k];

const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const effs = s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="eff">$1</span>');
const tierCat = t=>{ if(!t) return 'na'; if(t==='SS') return 'ss'; const c=t[0]; if(c==='S')return 's'; if(c==='A')return 'a'; if(c==='B')return 'b'; return 'c'; };
const tierRank = t=>TIER_RANK[t] ?? 0;

function gTitle(c){ return state.lang==='th' && c.th && c.th.title ? c.th.title : (c.title||''); }
function gNotes(c){ return state.lang==='th' && c.th && c.th.notes ? c.th.notes : (c.notes||''); }
function gTalent(c){
  if(state.lang==='th' && c.th && c.th.talent && c.th.talent.length)
    return c.th.talent.map(t=>({level:t.level, text:t.text}));
  return (c.talentLevels||[]).map(t=>({level:t.level, text:t.text}));
}
function gSkillDesc(c,s){
  if(state.lang==='th' && c.th && c.th.skillDesc && c.th.skillDesc[s.name]) return c.th.skillDesc[s.name];
  return s.desc||'';
}
function gSkillTldr(c,s){
  if(state.lang==='th' && c.th && c.th.skillTldr && c.th.skillTldr[s.name]) return c.th.skillTldr[s.name];
  return '';
}
function gSkillType(s){ return state.lang==='th' ? (TYPE_TH[s.type]||s.type) : s.type; }
function gRelicNote(c){ if(!c.relic) return ''; return state.lang==='th' && c.th && c.th.relicNote ? c.th.relicNote : (c.relic.note||''); }

function countFor(key){ return key==='all' ? DATA.length : DATA.filter(c=>c.klass===key).length; }

function applyStaticI18n(){
  $('#search').placeholder = T('searchPh');
  $('#navlabel').textContent = T('info');
  $('#sidefoot').innerHTML = T('foot');
  const vt=$('#viewToggle').querySelectorAll('button'); vt[0].textContent=T('cards'); vt[1].textContent=T('table');
  vt[0].classList.toggle('active',state.view==='cards'); vt[1].classList.toggle('active',state.view==='table');
  const so=$('#sort');
  so.innerHTML = `<option value="overall">${T('sortOverall')}</option><option value="pve">${T('sortPve')}</option><option value="pvp">${T('sortPvp')}</option><option value="name">${T('sortName')}</option>`;
  so.value = state.sort;
}

function buildSidebar(){
  const nav = $('#classlist');
  const items = [{key:'all',label:T('all'),raw:'#9aa3b8'}].concat(CLASS_KEYS.map(k=>({key:k,label:CLASS_LABEL[k],raw:CLR[k]})));
  nav.innerHTML = items.map(c=>`
    <button class="classbtn${c.key===state.klass?' active':''}" data-k="${c.key}">
      <span class="dot" style="color:${c.raw};background:${c.raw}"></span>
      ${c.label}<span class="cnt">${countFor(c.key)}</span>
    </button>`).join('');
  nav.querySelectorAll('.classbtn').forEach(b=>b.onclick=()=>{
    state.klass=b.dataset.k; closeMenu(); render();
    nav.querySelectorAll('.classbtn').forEach(x=>x.classList.toggle('active',x===b));
  });
}

function filtered(){
  let list = state.klass==='all' ? DATA.slice() : DATA.filter(c=>c.klass===state.klass);
  const q = state.q.trim().toLowerCase();
  if(q){
    list = list.filter(c=>{
      const hay = [c.name,c.title,gTitle(c),(c.tags||[]).join(' '),(c.subclasses||[]).join(' '),
        c.notes,gNotes(c),(c.skills||[]).map(s=>s.name+' '+s.desc).join(' ')].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  const s=state.sort;
  if(s==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  else{ const k=s==='pve'?'PvE':s==='pvp'?'PvP':'Overall';
    list.sort((a,b)=> tierRank(b.rat[k])-tierRank(a.rat[k]) || a.name.localeCompare(b.name)); }
  return list;
}

function tierBadge(lab,val){
  return `<div class="tbadge"><span class="lab">${lab}</span><span class="val tier-${tierCat(val)}">${esc(val||'—')}</span></div>`;
}

function cardHTML(c){
  const clr=CLR[c.klass];
  return `<div class="card" style="--cc:${clr}" data-slug="${c.slug}">
    <div class="crow">
      <div class="nm">${esc(c.name)}</div>
      <div class="cls">${esc(c.classLabel)}</div>
    </div>
    <div class="ttl">${esc(gTitle(c))}</div>
    <div class="tiers">
      ${tierBadge(T('ovr'),c.rat.Overall)}
      ${tierBadge('PvE',c.rat.PvE)}
      ${tierBadge('PvP',c.rat.PvP)}
    </div>
    ${(c.tags&&c.tags.length)?`<div class="facs">${c.tags.map(t=>`<span class="fac">${esc(t)}</span>`).join('')}</div>`:''}
  </div>`;
}

function tableHTML(list){
  const rows = list.map(c=>`<tr data-slug="${c.slug}">
    <td class="nm"><span class="clsdot" style="background:${CLR[c.klass]}"></span>${esc(c.name)}</td>
    <td style="color:var(--muted)">${esc(c.classLabel)}</td>
    <td style="color:var(--muted);font-style:italic">${esc(gTitle(c))}</td>
    <td class="tier tier-${tierCat(c.rat.Overall)}">${esc(c.rat.Overall||'—')}</td>
    <td class="tier tier-${tierCat(c.rat.PvE)}">${esc(c.rat.PvE||'—')}</td>
    <td class="tier tier-${tierCat(c.rat.PvP)}">${esc(c.rat.PvP||'—')}</td>
  </tr>`).join('');
  return `<table class="tbl"><thead><tr>
    <th>${T('colChar')}</th><th>${T('colClass')}</th><th>${T('colTitle')}</th><th style="text-align:center">${T('ovr')}</th><th style="text-align:center">PvE</th><th style="text-align:center">PvP</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

function render(){
  const list = filtered();
  $('#title').innerHTML = `${state.klass==='all'?T('allTitle'):CLASS_LABEL[state.klass]} <span class="pill">${list.length}</span>`;
  const content = $('#content');
  if(!list.length){ content.innerHTML = `<div class="empty">${T('empty')} "${esc(state.q)}" 🐉</div>`; return; }
  if(state.view==='cards'){
    content.innerHTML = `<div class="grid">${list.map(cardHTML).join('')}</div>`;
    content.querySelectorAll('.card').forEach(el=>el.onclick=()=>openDetail(el.dataset.slug));
  }else{
    content.innerHTML = tableHTML(list);
    content.querySelectorAll('tbody tr').forEach(el=>el.onclick=()=>openDetail(el.dataset.slug));
  }
}

let lastSlug = null;
function openDetail(slug){
  const c = DATA.find(x=>x.slug===slug); if(!c) return;
  lastSlug = slug;
  const clr=CLR[c.klass];
  let h = `<div class="mhead" style="--cc:${clr}">
    <button class="close" id="mclose">✕</button>
    <div class="mcls">${esc(c.classLabel)}</div>
    <h3>${esc(c.name)}</h3>
    <div class="mttl">${esc(gTitle(c))}</div>
    ${(c.tags&&c.tags.length)?`<div class="mfacs">${c.tags.map(t=>`<span class="fac">${esc(t)}</span>`).join('')}</div>`:''}
    <div class="mtiers">
      <div class="mt"><div class="lab">${T('ovr')}</div><div class="val tier-${tierCat(c.rat.Overall)}">${esc(c.rat.Overall||'—')}</div></div>
      <div class="mt"><div class="lab">PvE</div><div class="val tier-${tierCat(c.rat.PvE)}">${esc(c.rat.PvE||'—')}</div></div>
      <div class="mt"><div class="lab">PvP</div><div class="val tier-${tierCat(c.rat.PvP)}">${esc(c.rat.PvP||'—')}</div></div>
    </div>
  </div><div class="mbody">`;

  const notes = gNotes(c);
  if(notes) h += `<div class="sec"><div class="notes">📝 ${effs(notes)}</div></div>`;

  if(c.gear&&c.gear.length){
    h += `<div class="sec"><div class="h">${T('gear')}</div><table class="geartbl">${
      c.gear.map(g=>`<tr><td class="slot">${esc(g.slot)}</td><td class="item">${esc(g.item||'—')}</td><td class="set">${esc(g.set||'')}</td></tr>`).join('')
    }</table></div>`;
  }

  const subRelic = [];
  if(c.subclasses&&c.subclasses.length)
    subRelic.push(`<div class="kvline" style="margin-bottom:10px"><span style="color:var(--muted);font-size:12px">${T('subclass')}:</span>${c.subclasses.map(s=>`<span class="chip sub">${esc(s)}</span>`).join('')}</div>`);
  if(c.relic){
    const rn=gRelicNote(c);
    subRelic.push(`<div class="relic"><div class="rname">⚔ ${esc(c.relic.name)}</div><div class="rmeta">${T('relic')} · Tier <b class="tier-${tierCat(c.relic.tier)}">${esc(c.relic.tier||'—')}</b> · ${T('priority')}: ${esc(c.relic.priority||'—')}</div>${rn?`<div class="rnote">${effs(rn)}</div>`:''}</div>`);
  }
  if(c.teams)
    subRelic.push(`<div class="kvline" style="margin-top:10px"><span style="color:var(--muted);font-size:12px">${T('teams')}:</span> <span style="font-size:12.5px;color:var(--muted)">${esc(c.teams)}</span></div>`);
  if(subRelic.length) h += `<div class="sec"><div class="h">${T('build')}</div>${subRelic.join('')}</div>`;

  const tl = gTalent(c);
  if(tl.length){
    h += `<div class="sec"><div class="h">${T('talent')}${c.talentName?' — '+esc(c.talentName):''}</div>${
      tl.map(t=>`<div class="tline"><div class="lv">Lv.${esc(t.level)}</div><div class="tx">${effs(t.text)}</div></div>`).join('')
    }</div>`;
  }

  if(c.skills&&c.skills.length){
    h += `<div class="sec"><div class="h">${T('skills')}</div>${
      c.skills.map(s=>{const td=gSkillTldr(c,s);return `<div class="skill"><div class="sh"><span class="sn">${esc(s.name)}</span><span class="styp">${esc(gSkillType(s))}</span>${s.cd?`<span class="scd">CD ${esc(s.cd)}</span>`:''}</div>${td?`<div class="tldr"><span class="zz">⚡</span><span>${effs(td)}</span></div>`:''}<div class="sd">${effs(gSkillDesc(c,s))}</div></div>`;}).join('')
    }</div>`;
  }

  h += `</div>`;
  $('#modal').innerHTML = h;
  $('#overlay').classList.add('open');
  document.body.style.overflow='hidden';
  $('#mclose').onclick = closeDetail;
}
function closeDetail(){ $('#overlay').classList.remove('open'); document.body.style.overflow=''; lastSlug=null; }
function closeMenu(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('open'); }

function setLang(l){
  state.lang=l;
  document.documentElement.lang=l;
  $('#langToggle').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.l===l));
  applyStaticI18n(); buildSidebar(); render();
  if($('#overlay').classList.contains('open') && lastSlug) openDetail(lastSlug);
}

// events
$('#search').oninput = e=>{ state.q=e.target.value; render(); };
$('#sort').onchange = e=>{ state.sort=e.target.value; render(); };
$('#viewToggle').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  state.view=b.dataset.v; render();
  $('#viewToggle').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
});
$('#langToggle').querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#menuBtn').onclick = ()=>{ $('#sidebar').classList.add('open'); $('#scrim').classList.add('open'); };
